<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자리 뽑기</title>
<style>
  :root {
    --bg: #f4efe6;
    --board: #2f5d50;
    --board-edge: #8a6a45;
    --seat: #ffffff;
    --seat-border: #cfc6b4;
    --text: #33413c;
    --accent: #3f7d6b;
    --accent-dark: #2f6152;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2vh 3vw;
    gap: 2vh;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: clamp(22px, 2.6vw, 40px);
    font-weight: 700;
  }
  .controls input {
    width: 3.2em;
    font-size: inherit;
    font-weight: 700;
    text-align: center;
    padding: 6px 8px;
    border: 3px solid var(--seat-border);
    border-radius: 14px;
    background: #fff;
    color: var(--text);
  }
  .controls input:focus { outline: none; border-color: var(--accent); }
  .controls button {
    font-size: inherit;
    font-weight: 700;
    font-family: inherit;
    padding: 10px 34px;
    border: none;
    border-radius: 16px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--accent-dark);
    transition: transform .08s, box-shadow .08s;
  }
  .controls button:hover { background: #48897a; }
  .controls button:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--accent-dark); }
  .controls2 {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: clamp(18px, 2vw, 32px);
    font-weight: 700;
    color: #5a6862;
  }
  .controls2 input {
    width: 2.8em;
    font-size: inherit;
    font-weight: 700;
    text-align: center;
    padding: 4px 6px;
    border: 3px solid var(--seat-border);
    border-radius: 12px;
    background: #fff;
    color: var(--text);
  }
  .controls2 input:focus { outline: none; border-color: var(--accent); }
  .msg { min-height: 1.4em; font-size: clamp(16px, 1.6vw, 24px); color: #b0523f; font-weight: 700; }

  .board {
    width: min(100%, 1500px);
    text-align: center;
    background: var(--board);
    color: #f2f0e6;
    font-size: clamp(34px, 4.4vw, 68px);
    font-weight: 800;
    letter-spacing: .5em;
    padding: .3em 0 .3em .5em;
    border: 10px solid var(--board-edge);
    border-radius: 12px;
  }
  .grid {
    width: min(100%, 1500px);
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: clamp(8px, 1.4vw, 22px);
    flex: 1;
  }
  .seat {
    background: var(--seat);
    border: 3px solid var(--seat-border);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(40px, 7vw, 110px);
    font-weight: 800;
    min-height: 8vh;
    box-shadow: 0 4px 0 #ddd5c3;
  }
  .seat.empty { background: transparent; border-style: dashed; box-shadow: none; }
  .seat.roll { background: #fff8e1; border-color: #e8c766; box-shadow: 0 4px 0 #ecd9a0; }
  .seat.land { animation: land .5s ease-out; }
  @keyframes land {
    0%   { transform: scale(1.18); background: #ffe9a8; }
    100% { transform: scale(1); }
  }
  .controls button:disabled { opacity: .7; cursor: not-allowed; transform: none; box-shadow: 0 5px 0 var(--accent-dark); }
  #fx { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
</style>
</head>
<body>

<div class="controls">
  <label for="count">학생 수</label>
  <input id="count" type="number" min="1" max="60" value="24">
  <button id="draw" type="button">자리 뽑기</button>
</div>
<div class="controls2">
  <span>짝이 되면 안 되는 번호</span>
  <input id="ban1" type="number" min="1" max="60" placeholder="">
  <span>번 &amp;</span>
  <input id="ban2" type="number" min="1" max="60" placeholder="">
  <span>번</span>
</div>
<div class="msg" id="msg"></div>

<div class="board">칠 판</div>
<div class="grid" id="grid"></div>
<canvas id="fx"></canvas>

<script>
  var COLS = 6;
  var grid = document.getElementById('grid');
  var countInput = document.getElementById('count');
  var msg = document.getElementById('msg');

  function randInt(n) {
    if (window.crypto && crypto.getRandomValues) {
      var a = new Uint32Array(1);
      crypto.getRandomValues(a);
      return a[0] % n;
    }
    return Math.floor(Math.random() * n);
  }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = randInt(i + 1);
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  // 같은 짝(1·2, 3·4, 5·6번째 자리)에 a, b가 함께 앉았는지
  function isPaired(nums, a, b) {
    var pa = nums.indexOf(a), pb = nums.indexOf(b);
    return Math.floor(pa / 2) === Math.floor(pb / 2);
  }

  // 조건(짝 금지)에 맞는 최종 배치를 미리 만들어 둠. 실패하면 null
  function makeArrangement(n, a, b) {
    var nums = [];
    for (var i = 1; i <= n; i++) nums.push(i);
    var tries = 0;
    do {
      shuffle(nums);
      tries++;
    } while (a && b && isPaired(nums, a, b) && tries < 5000);
    if (a && b && isPaired(nums, a, b)) return null;
    return nums;
  }

  // 화면에 자리 그리기 (mode: 'roll' 돌아가는 중 / 'land' 멈춘 순간)
  function paint(nums, mode) {
    var n = nums.length;
    var rows = Math.max(4, Math.ceil(n / COLS));
    var total = rows * COLS;
    grid.innerHTML = '';
    grid.style.gridTemplateRows = 'repeat(' + rows + ', 1fr)';
    for (var k = 0; k < total; k++) {
      var d = document.createElement('div');
      d.className = 'seat';
      if (k < n) {
        d.textContent = nums[k];
        if (mode) d.classList.add(mode);
      } else {
        d.classList.add('empty');
      }
      grid.appendChild(d);
    }
  }

  /* ---------- 효과음 (Web Audio API, 소리 파일 없음) ---------- */
  var actx = null, noiseBuf = null;

  function getAudio() {
    try {
      if (!actx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) actx = new AC();
      }
      if (actx && actx.state === 'suspended') actx.resume();
    } catch (e) { actx = null; }
    return actx;
  }

  function getNoise(ctx) {
    if (!noiseBuf || noiseBuf.sampleRate !== ctx.sampleRate) {
      var len = Math.floor(ctx.sampleRate * 2.5);
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      var data = noiseBuf.getChannelData(0);
      for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    }
    return noiseBuf;
  }

  function noiseBurst(ctx, when, dur, type, freq, q, vol) {
    var src = ctx.createBufferSource();
    src.buffer = getNoise(ctx);
    var f = ctx.createBiquadFilter();
    f.type = type; f.frequency.value = freq; f.Q.value = q;
    var g = ctx.createGain();
    g.gain.setValueAtTime(vol, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + dur);
    src.connect(f); f.connect(g); g.connect(ctx.destination);
    src.start(when, Math.random() * 0.3);
    src.stop(when + dur + 0.02);
  }

  function tone(ctx, freq, when, dur, type, vol) {
    var o = ctx.createOscillator();
    o.type = type; o.frequency.value = freq;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(vol, when + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(when); o.stop(when + dur + 0.02);
  }

  // 드럼롤(점점 커짐) → 빵빠레 → 폭죽 펑펑
  function playSounds(ctx, rollSec) {
    var t0 = ctx.currentTime + 0.02;
    var step = 0.055;
    var count = Math.floor(rollSec / step);
    for (var i = 0; i < count; i++) {
      var t = i * step;
      var p = t / rollSec;
      noiseBurst(ctx, t0 + t, 0.05, 'bandpass', 1800, 0.8, 0.10 + 0.40 * p);
      if (i % 2 === 0) tone(ctx, 110, t0 + t, 0.08, 'sine', 0.10 + 0.20 * p);
    }

    var tf = t0 + rollSec;
    var intro = [[523.25, 0], [523.25, 0.16], [659.25, 0.32], [783.99, 0.48]];
    intro.forEach(function (n) {
      tone(ctx, n[0], tf + n[1], 0.14, 'square', 0.07);
    });
    [523.25, 659.25, 783.99, 1046.5].forEach(function (f) {
      tone(ctx, f, tf + 0.7, 1.4, 'triangle', 0.08);
      tone(ctx, f, tf + 0.7, 1.4, 'square', 0.025);
    });
    noiseBurst(ctx, tf + 0.7, 1.6, 'highpass', 5000, 0.7, 0.2);

    [0.15, 0.65, 1.15, 1.65].forEach(function (d) {
      noiseBurst(ctx, tf + d, 0.35, 'lowpass', 900, 0.7, 0.3);
      tone(ctx, 70, tf + d, 0.25, 'sine', 0.25);
    });
  }

  /* ---------- 폭죽 & 색종이 (canvas) ---------- */
  var cv = document.getElementById('fx');
  var cx = cv.getContext('2d');
  var parts = [];
  var loopOn = false, rainUntil = 0, fxEnd = 0;
  var COLORS = ['#e8590c', '#f59f00', '#2f9e44', '#1c7ed6', '#ae3ec9', '#e64980', '#fcc419'];

  function resizeFx() {
    cv.width = window.innerWidth;
    cv.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeFx);
  resizeFx();

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pickColor() { return COLORS[Math.floor(Math.random() * COLORS.length)]; }

  function addConfetti(x, y, vx, vy, g, drag) {
    parts.push({
      k: 'c', x: x, y: y, vx: vx, vy: vy, g: g, drag: drag,
      rot: rnd(0, 6.28), vr: rnd(-0.25, 0.25), flip: rnd(0, 6.28),
      w: rnd(10, 18), h: rnd(7, 12), color: pickColor(), life: 500
    });
  }

  function cannon(fromLeft) {
    var x = fromLeft ? 0 : cv.width;
    var scale = cv.height / 900;
    for (var i = 0; i < 80; i++) {
      var sp = rnd(12, 26) * scale;
      var vx = (fromLeft ? 1 : -1) * sp * rnd(0.3, 0.85);
      var vy = -sp * rnd(0.6, 1);
      addConfetti(x, cv.height, vx, vy, 0.28, 0.99);
    }
  }

  function firework() {
    var x = rnd(cv.width * 0.15, cv.width * 0.85);
    var y = rnd(cv.height * 0.12, cv.height * 0.5);
    var base = pickColor();
    var scale = cv.height / 900;
    for (var i = 0; i < 90; i++) {
      var a = rnd(0, 6.283), s = rnd(2, 9.5) * scale;
      parts.push({
        k: 'f', x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        g: 0.07, drag: 0.985, r: rnd(2, 4.5),
        color: Math.random() < 0.7 ? base : pickColor(), life: rnd(60, 100)
      });
    }
  }

  function fxLoop() {
    cx.clearRect(0, 0, cv.width, cv.height);
    var now = performance.now();
    if (now < rainUntil) {
      for (var r = 0; r < 3; r++) {
        addConfetti(rnd(0, cv.width), -20, rnd(-1.5, 1.5), rnd(2, 5), 0.02, 0.995);
      }
    }
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.vx *= p.drag;
      p.vy = p.vy * p.drag + p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.life--;
      if (p.k === 'c') {
        if (p.y > cv.height + 30 || p.life <= 0) { parts.splice(i, 1); continue; }
        p.rot += p.vr;
        p.flip += 0.18;
        cx.save();
        cx.translate(p.x, p.y);
        cx.rotate(p.rot);
        cx.fillStyle = p.color;
        cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.cos(p.flip));
        cx.restore();
      } else {
        if (p.life <= 0) { parts.splice(i, 1); continue; }
        cx.globalAlpha = Math.min(1, p.life / 30);
        cx.fillStyle = p.color;
        cx.beginPath();
        cx.arc(p.x, p.y, p.r, 0, 6.283);
        cx.fill();
        cx.globalAlpha = 1;
      }
    }
    if (parts.length || now < fxEnd) {
      requestAnimationFrame(fxLoop);
    } else {
      loopOn = false;
      cx.clearRect(0, 0, cv.width, cv.height);
    }
  }

  function celebrate() {
    var now = performance.now();
    rainUntil = now + 2500;
    fxEnd = now + 3200;
    cannon(true); cannon(false);
    setTimeout(function () { cannon(true); cannon(false); }, 600);
    [150, 650, 1150, 1650].forEach(function (ms) { setTimeout(firework, ms); });
    if (!loopOn) { loopOn = true; requestAnimationFrame(fxLoop); }
  }

  /* ---------- 두구두구 뽑기 ---------- */
  var ban1 = document.getElementById('ban1');
  var ban2 = document.getElementById('ban2');
  var drawBtn = document.getElementById('draw');
  var rolling = false;

  function setBusy(b) {
    rolling = b;
    drawBtn.disabled = b;
    countInput.disabled = b;
    ban1.disabled = b;
    ban2.disabled = b;
    drawBtn.textContent = b ? '두구두구…' : '자리 뽑기';
  }

  function startRoll(n, finalNums) {
    var ROLL_MS = 3000;
    setBusy(true);
    var ctx = getAudio();
    if (ctx) { try { playSounds(ctx, ROLL_MS / 1000); } catch (e) {} }

    var nums = [];
    for (var i = 1; i <= n; i++) nums.push(i);
    paint(shuffle(nums), 'roll');
    var timer = setInterval(function () { paint(shuffle(nums), 'roll'); }, 70);

    setTimeout(function () {
      clearInterval(timer);
      paint(finalNums, 'land');
      celebrate();
      setBusy(false);
    }, ROLL_MS);
  }

  function draw() {
    if (rolling) return;
    var n = parseInt(countInput.value, 10);
    if (isNaN(n) || n < 1 || n > 60) {
      msg.textContent = '학생 수는 1~60 사이로 넣어 주세요.';
      return;
    }
    var a = parseInt(ban1.value, 10);
    var b = parseInt(ban2.value, 10);
    var hasA = !isNaN(a), hasB = !isNaN(b);
    if (hasA !== hasB) {
      msg.textContent = '짝이 되면 안 되는 번호는 두 칸 모두 적어 주세요.';
      return;
    }
    if (hasA) {
      if (a === b) {
        msg.textContent = '서로 다른 두 번호를 적어 주세요.';
        return;
      }
      if (a < 1 || b < 1 || a > n || b > n) {
        msg.textContent = '짝 금지 번호는 1~' + n + ' 사이로 넣어 주세요.';
        return;
      }
    } else {
      a = 0; b = 0;
    }
    msg.textContent = '';
    var finalNums = makeArrangement(n, a, b);
    if (!finalNums) {
      msg.textContent = '조건에 맞는 자리 배치를 만들 수 없어요.';
      return;
    }
    startRoll(n, finalNums);
  }

  document.getElementById('draw').addEventListener('click', draw);
  [countInput, ban1, ban2].forEach(function (el) {
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') draw();
    });
  });

  // 처음 화면: 빈 자리 틀만 보여 주기
  (function init() {
    var n = parseInt(countInput.value, 10) || 24;
    var rows = Math.max(4, Math.ceil(n / COLS));
    grid.style.gridTemplateRows = 'repeat(' + rows + ', 1fr)';
    for (var k = 0; k < rows * COLS; k++) {
      var d = document.createElement('div');
      d.className = 'seat empty';
      grid.appendChild(d);
    }
  })();
</script>
</body>
</html>
